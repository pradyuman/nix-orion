name: Update Orion

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-orion
  cancel-in-progress: true

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      update-available: ${{ steps.update.outputs.update-available }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check Kagi for an update
        id: update
        run: |
          ./scripts/update.sh

          if ! git diff --quiet -- sources.json; then
            echo "update-available=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    name: Validate and commit update
    needs: check
    if: needs.check.outputs.update-available == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write # Commit the source update after validation.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Update source
        run: ./scripts/update.sh

      - name: Build and verify Kagi release
        run: ./scripts/verify.sh

      - name: Check changes
        run: git diff --check

      - name: Commit update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(plutil -extract darwin.aarch64.version raw -o - sources.json)"
          old_blob="$(git rev-parse HEAD:sources.json)"
          content="$(base64 < sources.json | tr -d '\n')"

          gh api \
            --method PUT \
            "/repos/$GITHUB_REPOSITORY/contents/sources.json" \
            --field message="update orion to $version" \
            --field content="$content" \
            --field sha="$old_blob" \
            --field branch="$GITHUB_REF_NAME" \
            --jq '.commit.html_url'
